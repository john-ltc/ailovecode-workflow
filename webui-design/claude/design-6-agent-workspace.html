<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design 6 · Agent Workspace — AILoveCode Workflow</title>
<style>
  :root {
    --bg: #111827;          /* brand gray-900 */
    --bg-deep: #0d1420;
    --card: #162131;        /* brand gray-850 */
    --card-2: #1b2839;
    --line: #24334a;
    --line-soft: #1d2a3d;
    --ink: #f8fafc;         /* brand #F8FAFC */
    --ink-2: #c3cbd8;
    --ink-3: #8b96a8;
    --ink-4: #5d6878;
    --heart: #ef4444;       /* brand red-500 */
    --heart-soft: #3a1d26;
    --heart-glow: rgba(239,68,68,.35);
    --green: #34d399;
    --green-soft: #143327;
    --blue: #60a5fa;
    --blue-soft: #16263e;
    --amber: #fbbf24;
    --amber-soft: #33290f;
    --sans: Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
    --shadow: 0 24px 70px rgba(5, 10, 20, .55);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 13px/1.6 var(--sans); overflow: hidden; }
  a { color: inherit; text-decoration: none; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: none; }
  :focus-visible { outline: 2px solid var(--heart); outline-offset: 2px; }
  ::selection { background: rgba(239,68,68,.3); }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: #2b3b55; border-radius: 99px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-track { background: transparent; }

  .app { height: 100vh; display: grid; grid-template-rows: 54px minmax(0, 1fr); }

  /* ================= TOP BAR ================= */
  .top {
    display: flex; align-items: center; gap: 14px; padding: 0 16px;
    border-bottom: 1px solid var(--line); background: rgba(17,24,39,.75);
    backdrop-filter: blur(14px); z-index: 30;
  }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 15px; letter-spacing: -.01em; }
  .logo .heart { color: var(--heart); font-size: 15px; filter: drop-shadow(0 0 8px var(--heart-glow)); }
  .logo .thin { color: var(--ink-3); font-weight: 500; }
  .top-div { width: 1px; height: 22px; background: var(--line); margin: 0 2px; flex-shrink: 0; }

  .ws-wrap { position: relative; }
  .ws-switch {
    display: flex; align-items: center; gap: 8px; height: 33px; padding: 0 11px;
    border: 1px solid var(--line); border-radius: 9px; background: var(--card);
  }
  .ws-switch:hover { border-color: #35496b; }
  .ws-ic {
    width: 20px; height: 20px; border-radius: 6px; background: var(--heart-soft); color: #fca5a5;
    display: grid; place-items: center; font-size: 10px; flex-shrink: 0;
  }
  .ws-txt b { font-size: 12px; font-weight: 700; color: var(--ink); }
  .ws-chev { color: var(--ink-3); font-size: 10px; margin-left: 2px; }
  .ws-menu {
    position: absolute; top: 43px; left: 0; width: 316px; z-index: 60;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: var(--shadow); padding: 6px;
  }
  .ws-menu-label { padding: 7px 10px 3px; font-size: 9px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #55627a; }
  .ws-item { width: 100%; display: grid; grid-template-columns: 26px minmax(0,1fr) auto; gap: 10px; align-items: center; text-align: left; padding: 9px 10px; border-radius: 9px; }
  .ws-item:hover { background: var(--card-2); }
  .ws-item .ic2 { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; font-size: 11px; background: var(--bg-deep); border: 1px solid var(--line-soft); color: var(--ink-3); }
  .ws-item.on .ic2 { background: var(--heart-soft); border-color: rgba(239,68,68,.35); color: #fca5a5; }
  .ws-item .nm { font-size: 12px; font-weight: 700; }
  .ws-item .pth { display: block; font: 9px var(--mono); color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left; }
  .ws-item .tick { color: var(--green); font-size: 12px; font-weight: 800; }
  .ws-sep { height: 1px; background: var(--line-soft); margin: 5px 4px; }

  .git-line { display: flex; align-items: center; gap: 6px; color: var(--ink-3); font: 11px var(--mono); }
  .git-line:hover { color: var(--ink-2); }
  .git-line .b-ic { font-size: 12px; }
  .git-line .dirty { width: 6px; height: 6px; border-radius: 50%; background: var(--amber); margin-left: 4px; }
  .git-line .dn { font-size: 10px; }

  .serve-chip { display: flex; align-items: center; gap: 7px; color: var(--ink-3); font: 10px var(--mono); }
  .serve-chip i { font-style: normal; width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: livepulse 1.8s infinite; }
  @keyframes livepulse { 50% { box-shadow: 0 0 0 4px rgba(52,211,153,.15); } }
  .top-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .icon-btn { width: 32px; height: 32px; border: 1px solid var(--line); border-radius: 9px; background: var(--card); color: var(--ink-3); }
  .icon-btn:hover { color: var(--ink); border-color: #35496b; }
  .avatar {
    width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--heart) 0%, #b91c1c 100%);
    color: #fff; font-size: 10.5px; font-weight: 800;
  }
  .mobile-only { display: none; }

  /* ================= WORKSPACE GRID ================= */
  .workspace { min-height: 0; display: grid; grid-template-columns: 272px minmax(400px, 1fr) 372px; grid-template-rows: minmax(0, 1fr); }

  /* ================= LEFT: TASKS ================= */
  .tasks-pane { min-width: 0; border-right: 1px solid var(--line); background: var(--bg-deep); display: flex; flex-direction: column; }
  .pane-head { padding: 15px 14px 10px; display: flex; align-items: center; justify-content: space-between; }
  .pane-head h2 { font-size: 13px; font-weight: 700; }
  .pane-head .count { font: 10.5px var(--mono); color: var(--ink-3); }
  .new-btn {
    margin: 0 14px 12px; display: flex; align-items: center; justify-content: center; gap: 7px;
    background: var(--heart); color: #fff; border-radius: 9px; padding: 8px; font-weight: 700; font-size: 12.5px;
    box-shadow: 0 4px 18px var(--heart-glow); transition: filter .15s;
  }
  .new-btn:hover { filter: brightness(1.1); }
  .task-search {
    margin: 0 14px 12px; width: calc(100% - 28px);
    border: 1px solid var(--line); border-radius: 9px; padding: 8px 11px;
    background: var(--card); color: var(--ink); font-size: 12px;
  }
  .task-search::placeholder { color: var(--ink-3); }
  .task-search:focus { outline: none; border-color: var(--heart); box-shadow: 0 0 0 3px rgba(239,68,68,.18); }

  .task-scroll { padding: 0 8px 8px; overflow-y: auto; flex: 1; min-height: 0; }
  .group { margin: 12px 8px 6px; color: var(--ink-3); font-size: 9.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
  .task-item {
    width: 100%; padding: 10px 10px; border-radius: 10px; background: transparent; text-align: left;
    border: 1px solid transparent;
  }
  .task-item:hover { background: var(--card); }
  .task-item.active { background: var(--card); border-color: var(--line); box-shadow: inset 2px 0 0 var(--heart); }
  .task-item .row1 { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 650; }
  .task-item .dot { width: 7px; height: 7px; border-radius: 50%; background: #47566e; flex-shrink: 0; }
  .task-item.state-active .dot { background: var(--heart); box-shadow: 0 0 0 3px rgba(239,68,68,.2); }
  .task-item.state-done .dot { background: var(--green); }
  .task-item .row1 .name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .task-item .row1 .when { flex-shrink: 0; font: 9.5px var(--mono); color: #55627a; }
  .task-item small { display: block; margin: 3px 0 0 15px; color: var(--ink-3); font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }


  /* ================= CENTER: TASK TIMELINE ================= */
  .center { min-width: 0; min-height: 0; display: grid; grid-template-rows: 58px minmax(0,1fr) auto; background: var(--bg); }
  .center-head { padding: 0 24px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
  .center-head h1 { font-size: 14.5px; font-weight: 750; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .state-pill { flex-shrink: 0; padding: 3.5px 10px; border-radius: 99px; font-size: 10px; font-weight: 750; display: flex; align-items: center; gap: 6px; }
  .state-pill::before { content: ""; width: 5px; height: 5px; border-radius: 50%; }
  .state-pill.active { background: var(--heart-soft); color: #fca5a5; }
  .state-pill.active::before { background: var(--heart); }
  .state-pill.done { background: var(--green-soft); color: var(--green); }
  .state-pill.done::before { background: var(--green); }
  .center-head .meta { margin-left: auto; color: var(--ink-3); font: 10px var(--mono); white-space: nowrap; }
  .open-inspect-btn { display: none; margin-left: 10px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: var(--card); color: var(--ink-2); font-size: 11px; }

  .timeline { min-height: 0; overflow-y: auto; padding: 26px clamp(20px, 4vw, 54px); }
  .timeline-inner { width: min(760px, 100%); margin: 0 auto; }

  .msg { display: grid; grid-template-columns: 30px minmax(0,1fr); gap: 12px; margin-bottom: 26px; }
  .speaker {
    width: 30px; height: 30px; border: 1px solid var(--line); border-radius: 9px;
    display: grid; place-items: center; background: var(--card); font-size: 10px; font-weight: 800; color: var(--ink-2);
  }
  .speaker.ai { background: var(--heart); border-color: var(--heart); color: #fff; box-shadow: 0 3px 14px var(--heart-glow); }
  .who { display: flex; gap: 9px; align-items: baseline; margin: 2px 0 8px; font-size: 11px; font-weight: 750; }
  .who time { color: var(--ink-3); font-weight: 400; font-size: 10px; }
  .bubble { padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink-2); font-size: 12.5px; }
  .bubble p { margin-bottom: 9px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble ul { padding-left: 19px; display: grid; gap: 3px; margin-bottom: 9px; }
  .bubble code, .md code { font: 11px var(--mono); background: var(--bg-deep); border: 1px solid var(--line-soft); border-radius: 5px; padding: 1px 6px; color: #fda4af; }
  .src-chip {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; padding: 4px 9px;
    border-radius: 7px; background: var(--bg-deep); border: 1px solid var(--line-soft); color: var(--ink-3); font: 10px var(--mono);
  }
  .src-chip b { color: var(--amber); font-weight: 600; }

  .agent-note { margin: 12px 0; padding-left: 13px; border-left: 2px solid #3b4d6b; color: var(--ink-3); font-size: 12px; }
  .agent-note strong { color: var(--ink-2); }

  /* plan card in timeline */
  .plan-card { margin: 14px 0; border: 1px solid var(--line); border-radius: 12px; background: var(--card); overflow: hidden; }
  .plan-card-head { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--line-soft); font-size: 11.5px; font-weight: 750; }
  .plan-card-head .tag { font-size: 9px; font-weight: 750; padding: 2px 8px; border-radius: 99px; background: var(--blue-soft); color: var(--blue); }
  .plan-card-head .steps { margin-left: auto; color: var(--ink-3); font: 10px var(--mono); font-weight: 400; }
  .pc-bar { height: 4px; background: var(--bg-deep); }
  .pc-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--heart), #f87171); }

  .ms { border-bottom: 1px solid var(--line-soft); }
  .ms:last-child { border-bottom: none; }
  .ms-btn { width: 100%; display: grid; grid-template-columns: 20px minmax(0,1fr) auto 14px; gap: 9px; align-items: center; padding: 10px 14px; text-align: left; }
  .ms-btn:hover { background: var(--card-2); }
  .ms-check {
    width: 16px; height: 16px; border: 1px solid #3b4d6b; border-radius: 5px;
    display: grid; place-items: center; color: var(--green); font-size: 9.5px;
  }
  .ms-check.done { border-color: rgba(52,211,153,.5); background: var(--green-soft); }
  .ms-btn strong { font-size: 11.5px; font-weight: 650; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ms.done .ms-btn strong { color: var(--ink-3); }
  .ms-btn .n { color: var(--ink-3); font: 9.5px var(--mono); }
  .ms-btn .chev { color: var(--ink-3); font-size: 10px; transition: transform .15s; }
  .ms.open .ms-btn .chev { transform: rotate(90deg); }
  .ms-items { display: none; padding: 3px 14px 11px 43px; }
  .ms.open .ms-items { display: block; }
  .ms-item { display: grid; grid-template-columns: 16px minmax(0,1fr); gap: 8px; padding: 3.5px 0; font-size: 11px; color: var(--ink-3); }
  .ms-item .bx { width: 13px; height: 13px; margin-top: 3px; border: 1px solid #3b4d6b; border-radius: 4px; display: grid; place-items: center; font-size: 8px; line-height: 1; color: var(--green); }
  .ms-item.done .bx { background: var(--green-soft); border-color: rgba(52,211,153,.5); }
  .ms-item.done span:last-child { text-decoration: line-through; text-decoration-color: #33415c; }

  .files-strip { margin: 12px 0; display: flex; flex-wrap: wrap; gap: 6px; }
  .file-chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px;
    border: 1px solid var(--line); border-radius: 7px; background: var(--bg-deep); font: 10px var(--mono); color: var(--ink-2);
  }
  .file-chip i { font-style: normal; color: var(--green); font-weight: 700; font-size: 9px; }

  .empty-plan {
    margin: 14px 0; padding: 22px; border: 1px dashed #33415c; border-radius: 12px;
    text-align: center; color: var(--ink-3); font-size: 12px;
  }
  .empty-plan .say { color: var(--ink-2); font-style: italic; }

  /* composer */
  .composer-wrap { padding: 12px clamp(16px, 4vw, 48px) 16px; background: linear-gradient(transparent, var(--bg) 30%); }
  .composer {
    width: min(760px, 100%); margin: 0 auto; border: 1px solid var(--line); border-radius: 14px;
    background: var(--card); box-shadow: 0 10px 34px rgba(5,10,20,.4); overflow: hidden;
  }
  .composer:focus-within { border-color: #3d5278; }
  .composer textarea {
    display: block; width: 100%; height: 58px; padding: 12px 15px;
    border: 0; outline: 0; resize: none; background: transparent; color: var(--ink); font-size: 12.5px;
  }
  .composer textarea::placeholder { color: var(--ink-3); }
  .composer-bar { display: flex; align-items: center; gap: 4px; padding: 7px 8px; border-top: 1px solid var(--line-soft); }
  .composer-opt { border-radius: 7px; padding: 5px 9px; color: var(--ink-3); font-size: 10.5px; }
  .composer-opt:hover { background: var(--card-2); color: var(--ink-2); }
  .send { margin-left: auto; width: 30px; height: 30px; border-radius: 9px; background: var(--heart); color: #fff; font-size: 15px; box-shadow: 0 3px 12px var(--heart-glow); }
  .send:hover { filter: brightness(1.1); }
  .composer-hint { margin-top: 7px; text-align: center; color: #55627a; font-size: 9.5px; }
  .composer-hint b { color: var(--ink-3); }

  /* center mode switch + chat */
  .center-seg { display: flex; gap: 3px; margin-left: 8px; padding: 3px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg-deep); flex-shrink: 0; }
  .cseg { padding: 4px 12px; border-radius: 7px; font-size: 11px; font-weight: 700; color: var(--ink-3); }
  .cseg:hover { color: var(--ink-2); }
  .cseg.on { background: var(--heart-soft); color: #fca5a5; }
  .cseg .cnt { font: 9px var(--mono); opacity: .8; margin-left: 4px; }
  .chat-session-note {
    display: flex; align-items: center; gap: 8px; margin-bottom: 20px; padding: 8px 12px;
    border: 1px dashed #33415c; border-radius: 9px; color: var(--ink-3); font: 10px var(--mono);
  }
  .chat-session-note b { color: #fda4af; font-weight: 600; }
  .bubble.you-chat { background: var(--card-2); }
  .save-line { margin-top: 9px; padding-top: 8px; border-top: 1px solid var(--line-soft); }
  .save-line button { font-size: 10px; font-weight: 700; color: var(--ink-3); }
  .save-line button:hover { color: #fda4af; }

  /* ================= RIGHT: INSPECTOR ================= */
  .inspector { min-width: 0; border-left: 1px solid var(--line); background: var(--bg-deep); display: flex; flex-direction: column; }
  .inspect-head { height: 58px; flex-shrink: 0; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid var(--line); }
  .inspect-head strong { font-size: 12px; }
  .close-inspect { display: none; margin-left: auto; font-size: 18px; color: var(--ink-3); }
  .tabs { display: flex; padding: 0 8px; border-bottom: 1px solid var(--line); }
  .tab { position: relative; flex: none; padding: 11px 10px; color: var(--ink-3); font-size: 10.5px; font-weight: 750; }
  .tab:hover { color: var(--ink-2); }
  .tab.active { color: var(--ink); }
  .tab.active::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; background: var(--heart); border-radius: 99px; }
  .inspect-body { min-height: 0; overflow-y: auto; padding: 16px; }
  .panel[hidden] { display: none; }

  .own-box { margin-bottom: 14px; padding: 11px 12px; border-radius: 10px; border: 1px solid; font-size: 10.5px; }
  .own-box.human { border-color: rgba(251,191,36,.35); background: var(--amber-soft); }
  .own-box.human strong { color: var(--amber); }
  .own-box.ai-owned { border-color: rgba(96,165,250,.3); background: var(--blue-soft); }
  .own-box.ai-owned strong { color: var(--blue); }
  .own-box strong { display: block; font-size: 10.5px; }
  .own-box p { margin-top: 4px; color: var(--ink-3); }

  .sec-title { margin: 16px 0 7px; color: var(--ink-3); font-size: 9px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
  .sec-title:first-child { margin-top: 0; }
  .md { font-size: 11.5px; color: var(--ink-2); line-height: 1.65; }
  .md p { margin-bottom: 8px; }
  .md ul { margin: 5px 0 8px; padding-left: 17px; display: grid; gap: 3px; }
  .md pre {
    margin: 8px 0; padding: 10px 12px; border-radius: 8px; overflow-x: auto;
    background: var(--bg); border: 1px solid var(--line-soft); color: #9fb0c8; font: 10px/1.6 var(--mono);
  }
  .empty-box { padding: 12px; border: 1px dashed #33415c; border-radius: 9px; color: var(--ink-3); font-size: 10.5px; }

  .ring-row { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 11px; background: var(--card); }
  .ring { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; }
  .ring::after {
    content: attr(data-pct); width: 33px; height: 33px; border-radius: 50%;
    display: grid; place-items: center; background: var(--card); font: 700 9px var(--sans); color: var(--ink);
  }
  .ring-row strong { display: block; font-size: 11.5px; }
  .ring-row small { color: var(--ink-3); font-size: 10px; }

  .mat-item { display: flex; align-items: center; gap: 10px; padding: 10px 4px; border-bottom: 1px solid var(--line-soft); }
  .mat-item:last-child { border-bottom: none; }
  .mat-icon { width: 32px; height: 32px; border-radius: 8px; background: var(--card); border: 1px solid var(--line); display: grid; place-items: center; font: 8.5px var(--mono); color: var(--ink-3); flex-shrink: 0; }
  .mat-item .nm { font-size: 11.5px; font-weight: 650; }
  .mat-item .pth { font: 9px var(--mono); color: var(--ink-3); word-break: break-all; }
  .mat-item .sz { margin-left: auto; font: 9.5px var(--mono); color: var(--ink-3); white-space: nowrap; }
  .mat-actions { display: flex; gap: 10px; margin-top: 2px; }
  .mat-actions a { font-size: 10px; font-weight: 700; color: #fda4af; }
  .mat-actions a:hover { text-decoration: underline; }
  .mat-actions a.rm { color: var(--ink-3); }
  .upload-box { margin-top: 12px; padding: 16px; border: 1.5px dashed #33415c; border-radius: 10px; text-align: center; color: var(--ink-3); font-size: 10.5px; }
  .upload-box b { color: #fda4af; }

  .tab sup { font: 8px var(--mono); color: var(--heart); margin-left: 2px; }
  .chg-row { display: flex; align-items: center; gap: 10px; padding: 8px 2px; border-bottom: 1px solid var(--line-soft); font: 10.5px var(--mono); color: var(--ink-2); }
  .chg-row:last-child { border-bottom: none; }
  .chg-badge { width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; font: 800 9px var(--sans); flex-shrink: 0; }
  .chg-badge.a { background: var(--green-soft); color: var(--green); }
  .chg-badge.m { background: var(--amber-soft); color: var(--amber); }
  .chg-path { word-break: break-all; }

/* Real git history — workflow-dev repository */
const COMMITS = [
  { h: "9455562", d: "Jun 23, 2026", m: 'create plan "WebUI Supporting Materials Management"' },
  { h: "bd7eb3b", d: "Jun 23, 2026", m: 'done plan "WebUI Task Creation"' },
  { h: "3695828", d: "Jun 23, 2026", m: 'create plan "WebUI Task Creation"' },
  { h: "ee29d09", d: "Jun 23, 2026", m: 'done "Embedded WebUI Task List Improvements"' },
  { h: "077d80a", d: "Jun 23, 2026", m: 'done plan "Embedded WebUI File Mode"' },
  { h: "913784a", d: "Jun 22, 2026", m: 'create plan "Embedded WebUI File Mode"' },
  { h: "b027a14", d: "Jun 22, 2026", m: "add workflow-dev for agents file" },
  { h: "0e62ced", d: "Jun 22, 2026", m: "install ailovecode-workflow" },
  { h: "ddbc1f5", d: "Jun 22, 2026", m: "Create README.md" }
];

const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
let selectedId = TASKS[0].id;

function notify(text) {
  const t = $("#toast");
  t.textContent = text; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2200);
}

function planStats(t) {
  const items = t.milestones.flatMap(m => m.items);
  const done = items.filter(i => i[1]).length;
  const msDone = t.milestones.filter(m => m.items.every(i => i[1])).length;
  return { done, total: items.length, pct: Math.round(done / items.length * 100), msDone, msTotal: t.milestones.length };
}

/* ---------- left pane ---------- */
function renderTaskList() {
  const q = ($("#taskSearch").value || "").trim().toLowerCase();
  const visible = TASKS.filter(t => !q || (t.name + " " + t.id).toLowerCase().includes(q));
  const groups = [...new Set(visible.map(t => t.group))];
  $("#taskScroll").innerHTML = groups.map(g => `
    <div class="group">${g}</div>
    ${visible.filter(t => t.group === g).map(t => `
      <button class="task-item state-${t.status} ${t.id === selectedId ? "active" : ""}" onclick="selectTask('${t.id}')">
        <span class="row1"><i class="dot"></i><span class="name">${t.name}</span><span class="when">${t.created.split(",")[0]}</span></span>
        ${t.status === "active" ? `<small>${t.statusLine.replace("In progress · ", "")}</small>` : ""}
      </button>`).join("")}`).join("")
    || `<div class="group" style="text-transform:none;letter-spacing:0">No tasks match “${q}”.</div>`;
  $("#taskCount").textContent = q ? visible.length + " / " + TASKS.length : TASKS.length + " folders";
}

/* ---------- center timeline ---------- */
function timelineHtml(t) {
  const s = planStats(t);
  const userMsg = `
    <article class="msg">
      <span class="speaker">You</span>
      <div>
        <div class="who">You <time>${t.created}</time></div>
        <div class="bubble">${t.request}
          <div class="src-chip">from <b>## Request</b> · task.md</div>
        </div>
      </div>
    </article>`;

  const planCard = `
    <div class="plan-card">
      <div class="plan-card-head">Implementation plan <span class="tag">AI-owned · read-only</span>
        <span class="steps">${s.msDone} of ${s.msTotal} milestones · ${s.pct}%</span></div>
      <div class="pc-bar"><i style="width:${s.pct}%"></i></div>
      ${t.milestones.map((m, i) => {
        const mDone = m.items.every(x => x[1]);
        const nDone = m.items.filter(x => x[1]).length;
        return `<div class="ms ${mDone ? "done" : ""} ${!mDone && t.status === "active" ? "open" : ""}">
          <button class="ms-btn" onclick="this.parentElement.classList.toggle('open')">
            <span class="ms-check ${mDone ? "done" : ""}">${mDone ? "✓" : ""}</span>
            <strong>${m.name}</strong>
            <span class="n">${nDone}/${m.items.length}</span>
            <span class="chev">›</span>
          </button>
          <div class="ms-items">
            ${m.items.map(([label, done]) => `<div class="ms-item ${done ? "done" : ""}"><span class="bx">${done ? "✓" : ""}</span><span>${label}</span></div>`).join("")}
          </div>
        </div>`;
      }).join("")}
    </div>`;

  const filesStrip = t.implementedIn.length ? `
    <div class="sec-title" style="margin-top:14px">Implemented in</div>
    <div class="files-strip">${t.implementedIn.map(f => `<span class="file-chip"><i>◆</i>${f}</span>`).join("")}</div>` : "";

  const agentMsg = `
    <article class="msg">
      <span class="speaker ai">A</span>
      <div>
        <div class="who">Agent <time>${t.created}</time></div>
        <div class="bubble"><p>${t.summary}</p>
          <div class="agent-note">Ownership honored: <strong>task.md</strong> stays yours; this plan lives in <strong>implementation-plan.md</strong> and is shown read-only.</div>
        </div>
        ${planCard}
        ${filesStrip}
      </div>
    </article>`;

  return userMsg + agentMsg;
}

/* ---------- inspector ---------- */
function inspectorHtml(t) {
  const s = planStats(t);

  $("#panelTask").innerHTML = `
    <div class="own-box human"><strong>● task.md — editable by you</strong>
      <p>Human-owned source of truth. The agent reads this file but never silently rewrites it.</p></div>
    <div class="sec-title">Context</div><div class="md">${t.context}</div>
    <div class="sec-title">Request</div><div class="md">${t.request}</div>
    <div class="sec-title">Reference</div>${t.reference ? `<div class="md">${t.reference}</div>` : `<div class="empty-box">No reference material added.</div>`}`;

  $("#panelPlan").innerHTML = `
    <div class="own-box ai-owned"><strong>● implementation-plan.md — AI-owned</strong>
      <p>Written by the agent during planning. Read-only in the WebUI.</p></div>
    <div class="ring-row">
      <span class="ring" data-pct="${s.pct}%" style="background:conic-gradient(var(--heart) 0 ${s.pct}%, #223146 ${s.pct}%)"></span>
      <div><strong>${t.name}</strong><small>${s.msDone} of ${s.msTotal} milestones · ${s.done}/${s.total} tasks checked</small></div>
    </div>
    <div class="sec-title">Summary</div><div class="md"><p>${t.summary}</p></div>
    <div class="sec-title">Milestones</div>
    <div class="md"><ul>${t.milestones.map(m => {
      const d = m.items.every(x => x[1]);
      return `<li style="${d ? "color:var(--ink-3)" : ""}">${d ? "✓ " : "· "}${m.name.replace(/^Milestone \d+ — /, "")}</li>`;
    }).join("")}</ul></div>`;

  $("#panelMaterials").innerHTML = (t.materials.length ? t.materials.map(f => `
    <div class="mat-item">
      <span class="mat-icon">${f.ext}</span>
      <span><span class="nm">${f.name}</span><br>
        <span class="pth">supporting-materials/${f.name}</span>
        <span class="mat-actions"><a href="#" onclick="notify('Demo: opens the file');return false">Open</a>
        <a href="#" onclick="notify('Demo: downloads the file');return false">Download</a>
        <a href="#" class="rm" onclick="notify('Demo: removes after confirmation');return false">Remove</a></span></span>
      <span class="sz">${f.size}</span>
    </div>`).join("")
    : `<div class="empty-box">No files in this task's supporting-materials/ folder.</div>`) + `
    <div class="upload-box">Drop files here or <b>browse</b><br>saved to supporting-materials/ · cite paths in Reference</div>`;

  $("#chgCount").textContent = t.changes.length;

  const added = t.changes.filter(c => c[1] === "A").length;
  const modified = t.changes.length - added;
  $("#panelChanges").innerHTML = `
    <div class="own-box ai-owned"><strong>● ${t.changes.length} file${t.changes.length === 1 ? "" : "s"} changed by this task</strong>
      <p>${added ? added + " added" : ""}${added && modified ? " · " : ""}${modified ? modified + " modified" : ""} — from the plan's “Implemented In” records. Review before accepting.</p></div>
    ${t.changes.map(([p, s]) => `<div class="chg-row"><span class="chg-badge ${s === "A" ? "a" : "m"}">${s}</span><span class="chg-path">${p}</span></div>`).join("")}
    <div class="chg-note">Full diffs live in your working tree — this panel is the task-scoped file index, not a code review.</div>`;

  $("#panelActivity").innerHTML = (t.commits.length ? `
    <div class="sec-title">Commits referencing this task</div>
    ${t.commits.map(c => `<div class="commit"><span class="c-dot"></span>
      <span><span class="c-msg">${c.m.replace(/&/g, "&amp;").replace(/</g, "&lt;")}</span><br>
      <span class="c-meta">${c.h} · ${c.d}</span></span></div>`).join("")}`
    : `<div class="empty-box">No commits reference this task yet — its changes are still uncommitted in the working tree.</div>`) + `
    <div class="sec-title" style="margin-top:18px">Repository head</div>
    <div class="md"><p style="font:10px var(--mono);color:var(--ink-3)">workflow-dev · main · ${COMMITS[0].h} — ${COMMITS[0].m.replace(/</g, "&lt;")}</p></div>`;
}

/* ---------- selection / navigation ---------- */
/* ---------- per-task chat ---------- */
function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function chatMsgHtml(m) {
  const you = m.who === "you";
  return `<article class="msg">
    <span class="speaker ${you ? "" : "ai"}">${you ? "You" : "A"}</span>
    <div>
      <div class="who">${you ? "You" : "Agent"} <time>${m.t}</time></div>
      <div class="bubble ${you ? "you-chat" : ""}">${m.html}${you ? `
        <div class="save-line"><button onclick="notify('Demo: appends this message to task.md — the only way chat touches your file')">↳ Save to task.md</button></div>` : ""}</div>
    </div>
  </article>`;
}
function renderChat(t) {
  $("#chatInner").innerHTML = `
    <div class="chat-session-note">⛁ Session scoped to this task — saved as <b>workflow/tasks/${t.id}/chat.md</b></div>
    ${t.chat.map(chatMsgHtml).join("")}`;
  $("#chatCnt").textContent = t.chat.length;
}

let centerMode = "log";
function setCenterMode(mode) {
  centerMode = mode;
  document.querySelectorAll(".cseg").forEach(b => b.classList.toggle("on", b.dataset.cmode === mode));
  $("#timeline").style.display = mode === "log" ? "" : "none";
  $("#chatScroll").style.display = mode === "chat" ? "" : "none";
  $("#composerWrap").style.display = mode === "chat" ? "" : "none";
  if (mode === "chat") {
    $("#chatScroll").scrollTop = $("#chatScroll").scrollHeight;
    $("#promptBox").focus({ preventScroll: true });
  }
}
document.querySelectorAll(".cseg").forEach(b => b.addEventListener("click", () => setCenterMode(b.dataset.cmode)));

function selectTask(id) {
  selectedId = id;
  const t = TASKS.find(x => x.id === id);
  $("#headTitle").textContent = t.name;
  const pill = $("#headState");
  pill.className = "state-pill " + (t.status === "done" ? "done" : "active");
  pill.textContent = t.status === "done" ? "Done" : "In progress";
  $("#headMeta").textContent = "workflow/tasks/" + t.id;
  $("#timelineInner").innerHTML = timelineHtml(t);
  renderChat(t);
  inspectorHtml(t);
  renderTaskList();
  $("#timeline").scrollTop = 0;
  $("#chatScroll").scrollTop = $("#chatScroll").scrollHeight;
  closePanes();
}

$$(".tab").forEach(tab => tab.addEventListener("click", () => {
  $$(".tab").forEach(x => x.classList.toggle("active", x === tab));
  $$("[data-panel]").forEach(p => p.hidden = p.dataset.panel !== tab.dataset.tab);
}));

$("#taskSearch").addEventListener("input", renderTaskList);

$("#composer").addEventListener("submit", e => {
  e.preventDefault();
  const input = $("#promptBox"), value = input.value.trim();
  if (!value) return;
  const t = TASKS.find(x => x.id === selectedId);
  t.chat.push({ who: "you", t: "now", html: "<p>" + escapeHtml(value) + "</p>" });
  renderChat(t);
  input.value = "";
  $("#chatScroll").scrollTop = $("#chatScroll").scrollHeight;
  setTimeout(() => {
    t.chat.push({ who: "agent", t: "now", html: "<p>Noted — in the real WebUI this message reaches the agent session for this task, and the reply lands here. <span style='color:var(--ink-3)'>(demo reply)</span></p>" });
    renderChat(t);
    $("#chatScroll").scrollTop = $("#chatScroll").scrollHeight;
  }, 650);
});

/* responsive drawers */
const tasksPane = $("#tasksPane"), inspector = $("#inspector"), scrim = $("#scrim");
function closePanes() { tasksPane.classList.remove("open"); inspector.classList.remove("open"); scrim.classList.remove("open"); closeWsMenu(); }

/* workspace switcher dropdown */
const wsBtn = $("#wsBtn"), wsMenu = $("#wsMenu");
function closeWsMenu() { wsMenu.hidden = true; wsBtn.setAttribute("aria-expanded", "false"); }
wsBtn.addEventListener("click", e => {
  e.stopPropagation();
  wsMenu.hidden = !wsMenu.hidden;
  wsBtn.setAttribute("aria-expanded", String(!wsMenu.hidden));
});
document.addEventListener("click", e => { if (!wsMenu.hidden && !wsMenu.contains(e.target)) closeWsMenu(); });
$("#openTasks").addEventListener("click", () => { tasksPane.classList.add("open"); scrim.classList.add("open"); });
$("#openInspector").addEventListener("click", () => { inspector.classList.add("open"); scrim.classList.add("open"); });
$("#closeInspector").addEventListener("click", closePanes);
scrim.addEventListener("click", closePanes);
document.addEventListener("keydown", e => { if (e.key === "Escape") closePanes(); });

renderTaskList();
selectTask(selectedId);
if (location.hash === "#chat") setCenterMode("chat");
if (location.hash === "#workspaces") { wsMenu.hidden = false; wsBtn.setAttribute("aria-expanded", "true"); }
</script>
